<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixpanel Master Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(180deg, #2d2e4f 0%, #1a1b2e 100%); position: fixed; height: 100vh; left: 0; top: 0; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-title { font-size: 16px; font-weight: 600; color: white; margin-bottom: 6px; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar-content { flex: 1; padding: 12px 0; overflow-y: auto; }
        .project-item { padding: 14px 16px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); transition: 0.3s; margin: 4px 8px; border-radius: 0 8px 8px 0; border-left: 3px solid transparent; }
        .project-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .project-item.active { background: linear-gradient(90deg, #667eea, #764ba2); border-left-color: #4ade80; color: white; font-weight: 500; }
        .main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
        .header { background: rgba(255,255,255,0.95); padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); flex-wrap: wrap; gap: 16px; }
        .header-left h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .header-left p { font-size: 13px; color: #888; }
        .header-right { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .date-controls { display: flex; gap: 10px; background: #f5f5f7; padding: 8px; border-radius: 12px; align-items: center; }
        .date-button { padding: 10px 16px; background: transparent; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; color: #666; transition: 0.3s; white-space: nowrap; }
        .date-button.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .date-input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
        .live-indicator { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); padding: 10px 16px; border-radius: 12px; }
        .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-text { font-size: 12px; color: #10b981; font-weight: 600; }
        .content { flex: 1; overflow-y: auto; padding: 32px; background: linear-gradient(135deg, rgba(102,126,234,0.05), rgba(118,75,162,0.05)); }
        .back-button { padding: 10px 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 8px; cursor: pointer; font-size: 13px; color: #667eea; margin-bottom: 20px; font-weight: 500; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .metric-card { background: rgba(255,255,255,0.95); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: 0.3s; }
        .metric-card:hover { transform: translateY(-8px); box-shadow: 0 16px 48px rgba(102, 126, 234, 0.2); }
        .metric-label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
        .metric-value { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .metric-change { font-size: 12px; color: #888; }
        .positive { color: #10b981 !important; }
        .negative { color: #ef4444 !important; }
        .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .project-card { background: rgba(255,255,255,0.95); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 24px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.1); position: relative; }
        .project-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #667eea, #764ba2); }
        .project-card:hover { transform: translateY(-12px); box-shadow: 0 20px 48px rgba(102, 126, 234, 0.25); }
        .project-card-title { font-weight: 600; color: #0b0b0b; margin-bottom: 16px; font-size: 15px; }
        .project-card-metrics { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .project-card-label { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; font-weight: 500; }
        .project-card-value { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .project-card-footer { border-top: 1px solid rgba(0,0,0,0.05); padding-top: 12px; font-size: 11px; color: #888; }
        .section-title { font-size: 20px; font-weight: 700; color: white; margin-bottom: 12px; margin-top: 32px; }
        .section-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
        .retention-section { background: rgba(255,255,255,0.95); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 28px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .retention-title { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .chart-wrapper { position: relative; height: 350px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">📊 Dashboard</div>
                <div class="sidebar-subtitle">9 Projects</div>
            </div>
            <div class="sidebar-content" id="projectList"></div>
        </div>

        <div class="main">
            <div class="header">
                <div class="header-left">
                    <h1 id="headerTitle">Analytics Dashboard</h1>
                    <p id="headerSubtitle">Real-time insights from all projects</p>
                </div>
                <div class="header-right">
                    <div class="date-controls">
                        <button class="date-button active" onclick="setDateRange(7)">7 days</button>
                        <button class="date-button" onclick="setDateRange(30)">30 days</button>
                        <button class="date-button" onclick="setDateRange(90)">90 days</button>
                        <input type="date" id="fromDate" class="date-input" onchange="setCustomDateRange()">
                        <input type="date" id="toDate" class="date-input" onchange="setCustomDateRange()">
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span class="live-text">Live</span>
                    </div>
                </div>
            </div>

            <div class="content" id="contentArea">
                <div style="text-align: center; color: rgba(255,255,255,0.8); padding: 40px;">⏳ Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const projects = ['Football Mania Web', 'Football Mania App', '2CanPlay Web', '2CanPlay Mobile App', 'Spin-N-Win', 'Wheel of Fortune', 'Edumillionaire', 'Fifty-Fifty', 'Football Frenzy'];
        let currentView = 'overview';
        let selectedProject = null;
        let dashboardData = {};
        let chartInstance = null;

        function init() {
            renderSidebar();
            setDefaultDates();
            refreshData();
        }

        function setDefaultDates() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('fromDate').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('toDate').value = today.toISOString().split('T')[0];
        }

        function renderSidebar() {
            const list = document.getElementById('projectList');
            list.innerHTML = projects.map((p, i) => `<div class="project-item ${i === 0 ? 'active' : ''}" onclick="selectProject(${i})">${p}</div>`).join('');
        }

        function selectProject(index) {
            selectedProject = index;
            currentView = 'detail';
            renderContent();
            updateSidebar();
        }

        function backToOverview() {
            currentView = 'overview';
            selectedProject = null;
            renderContent();
            updateSidebar();
        }

        function updateSidebar() {
            document.querySelectorAll('.project-item').forEach((item, i) => {
                item.classList.remove('active');
                if ((currentView === 'detail' && i === selectedProject) || (currentView === 'overview' && i === 0)) {
                    item.classList.add('active');
                }
            });
        }

        function setDateRange(days) {
            document.querySelectorAll('.date-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const today = new Date();
            const fromDate = new Date(today.getTime() - days * 24 * 60 * 60 * 1000);
            document.getElementById('fromDate').value = fromDate.toISOString().split('T')[0];
            document.getElementById('toDate').value = today.toISOString().split('T')[0];
            refreshData();
        }

        function setCustomDateRange() {
            document.querySelectorAll('.date-button').forEach(btn => btn.classList.remove('active'));
            refreshData();
        }

        async function refreshData() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            try {
                const response = await fetch(`/api/data?fromDate=${fromDate}&toDate=${toDate}`);
                const result = await response.json();

                if (result.success) {
                    dashboardData = result.data;
                    renderContent();
                } else {
                    document.getElementById('contentArea').innerHTML = `<div style="color: #ef4444; padding: 20px;">Error loading data</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('contentArea').innerHTML = `<div style="color: #ef4444; padding: 20px;">Failed to fetch data from Mixpanel</div>`;
            }
        }

        function renderContent() {
            if (currentView === 'overview') {
                renderOverview();
            } else {
                renderDetail();
            }
        }

        function renderOverview() {
            document.getElementById('headerTitle').textContent = '📊 Analytics Dashboard';
            document.getElementById('headerSubtitle').textContent = 'Real-time insights from all projects';
            
            const allData = Object.values(dashboardData);
            const totalDAU = allData.reduce((sum, p) => sum + p.dau, 0);
            const totalSignups = allData.reduce((sum, p) => sum + p.signups, 0);
            const avgStickiness = Math.round(allData.reduce((sum, p) => sum + p.stickiness, 0) / allData.length);
            const avgChurn = Math.round(allData.reduce((sum, p) => sum + p.churnRate, 0) / allData.length);

            let html = `<div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">👥 Total Active Users</div>
                    <div class="metric-value">${totalDAU.toLocaleString()}</div>
                    <div class="metric-change positive">↑ 8.2%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">✨ Total New Signups</div>
                    <div class="metric-value">${totalSignups.toLocaleString()}</div>
                    <div class="metric-change positive">↑ 12.5%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">📈 Avg Stickiness</div>
                    <div class="metric-value">${avgStickiness}%</div>
                    <div class="metric-change negative">↓ 2.1%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">📊 Avg Churn Rate</div>
                    <div class="metric-value">${avgChurn}%</div>
                    <div class="metric-change">Steady</div>
                </div>
            </div>
            <div class="section-title">🎮 Project Summary</div>
            <p class="section-subtitle">Click any project to view detailed performance metrics</p>
            <div class="projects-grid">`;
            
            projects.forEach((p, i) => {
                const data = dashboardData[i];
                html += `<div class="project-card" onclick="selectProject(${i})">
                    <div class="project-card-title">${p}</div>
                    <div class="project-card-metrics">
                        <div class="project-card-metric">
                            <div class="project-card-label">DAU</div>
                            <div class="project-card-value">${data.dau.toLocaleString()}</div>
                        </div>
                        <div class="project-card-metric">
                            <div class="project-card-label">Signups</div>
                            <div class="project-card-value">${data.signups}</div>
                        </div>
                    </div>
                    <div class="project-card-footer">Stickiness: ${data.stickiness}% • Churn: ${data.churnRate}%</div>
                </div>`;
            });
            
            html += `</div>`;
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderDetail() {
            const p = projects[selectedProject];
            const data = dashboardData[selectedProject];
            document.getElementById('headerTitle').textContent = '📊 ' + p;
            document.getElementById('headerSubtitle').textContent = 'Detailed performance metrics';

            const html = `<button class="back-button" onclick="backToOverview()">← Back to Overview</button>
                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-label">Daily Active</div><div class="metric-value">${data.dau.toLocaleString()}</div><div class="metric-change positive">↑ 5.2%</div></div>
                    <div class="metric-card"><div class="metric-label">Monthly Active</div><div class="metric-value">${data.mau.toLocaleString()}</div><div class="metric-change positive">↑ 3.1%</div></div>
                    <div class="metric-card"><div class="metric-label">Weekly Active</div><div class="metric-value">${data.wau.toLocaleString()}</div><div class="metric-change positive">↑ 2.8%</div></div>
                    <div class="metric-card"><div class="metric-label">Stickiness</div><div class="metric-value">${data.stickiness}%</div><div class="metric-change negative">↓ 1.5%</div></div>
                    <div class="metric-card"><div class="metric-label">Churn Rate</div><div class="metric-value">${data.churnRate}%</div><div class="metric-change">Steady</div></div>
                    <div class="metric-card"><div class="metric-label">⏱️ Avg Session Length</div><div class="metric-value">${data.sessionLength.toFixed(1)}m</div><div class="metric-change positive">↑ 2.3%</div></div>
                    <div class="metric-card"><div class="metric-label">🔄 Sessions Per User</div><div class="metric-value">${data.sessionFrequency.toFixed(1)}</div><div class="metric-change positive">↑ 4.1%</div></div>
                </div>
                <div class="retention-section">
                    <div class="retention-title">📊 Retention Cohort Analysis</div>
                    <div class="chart-wrapper">
                        <canvas id="retentionChart"></canvas>
                    </div>
                </div>`;
                
            document.getElementById('contentArea').innerHTML = html;
            setTimeout(() => drawChart(data), 200);
        }

        function drawChart(data) {
            const canvas = document.getElementById('retentionChart');
            if (!canvas) return;
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: ['D0', 'D1', 'D7', 'D30'],
                    datasets: [{
                        label: 'Retention %',
                        data: [100, data.retention.d1, data.retention.d7, data.retention.d30],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.15)',
                        borderWidth: 4,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 8,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: 'white',
                        pointBorderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { color: '#666', font: { size: 12 } } } },
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(102, 126, 234, 0.1)' }, ticks: { color: '#888' } },
                        x: { grid: { display: false }, ticks: { color: '#888' } }
                    }
                }
            });
        }

        init();
    </script>
</body>
</html>
