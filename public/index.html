<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixpanel Master Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(180deg, #2d2e4f 0%, #1a1b2e 100%); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow-y: auto; position: fixed; height: 100vh; left: 0; top: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); }
        .sidebar-title { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 6px; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 12px 0; }
        .project-item { padding: 14px 16px; border-left: 3px solid transparent; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); transition: all 0.3s; margin: 4px 8px; border-radius: 0 8px 8px 0; }
        .project-item:hover { background: rgba(255,255,255,0.1); color: #ffffff; transform: translateX(4px); }
        .project-item.active { background: linear-gradient(90deg, #667eea, #764ba2); border-left-color: #4ade80; color: #ffffff; font-weight: 500; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
        .header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header-left h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px; }
        .header-left p { font-size: 13px; color: #888; }
        .header-right { display: flex; gap: 20px; align-items: center; }
        .date-controls { display: flex; gap: 10px; align-items: center; background: #f5f5f7; padding: 8px; border-radius: 12px; }
        .date-button { padding: 10px 16px; background: transparent; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #666; font-weight: 500; transition: all 0.3s; }
        .date-button:hover { background: rgba(102, 126, 234, 0.1); color: #667eea; }
        .date-button.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #ffffff; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .live-indicator { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); padding: 10px 16px; border-radius: 12px; }
        .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 8px #10b981; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-text { font-size: 12px; color: #10b981; font-weight: 600; }
        .content { flex: 1; overflow-y: auto; padding: 32px; background: linear-gradient(135deg, rgba(102,126,234,0.05), rgba(118,75,162,0.05)); }
        .back-button { padding: 10px 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 8px; cursor: pointer; font-size: 13px; color: #667eea; margin-bottom: 20px; transition: all 0.3s; font-weight: 500; }
        .back-button:hover { background: linear-gradient(135deg, #667eea, #764ba2); color: #ffffff; border-color: transparent; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3); }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .metric-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: all 0.3s; position: relative; overflow: hidden; }
        .metric-card::before { content: ''; position: absolute; top: -50%; right: -50%; width: 200px; height: 200px; background: linear-gradient(135deg, #667eea20, #764ba220); border-radius: 50%; pointer-events: none; }
        .metric-card:hover { transform: translateY(-8px); box-shadow: 0 16px 48px rgba(102, 126, 234, 0.2); }
        .metric-label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.5px; }
        .metric-value { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
        .metric-change { font-size: 12px; color: #888; font-weight: 500; }
        .positive { color: #10b981 !important; }
        .negative { color: #ef4444 !important; }
        .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .project-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .project-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #667eea, #764ba2); }
        .project-card:hover { transform: translateY(-12px); box-shadow: 0 20px 48px rgba(102, 126, 234, 0.25); border-color: rgba(102, 126, 234, 0.3); }
        .project-card-title { font-weight: 600; color: #0b0b0b; margin-bottom: 16px; font-size: 15px; }
        .project-card-metrics { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .project-card-metric { flex: 1; }
        .project-card-label { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; font-weight: 500; }
        .project-card-value { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .project-card-footer { border-top: 1px solid rgba(0,0,0,0.05); padding-top: 12px; font-size: 11px; color: #888; font-weight: 500; }
        .section-title { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 12px; margin-top: 32px; text-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
        .retention-section { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 28px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .retention-title { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; }
        .retention-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .retention-table th { background: linear-gradient(135deg, #667eea15, #764ba215); padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #667eea30; color: #667eea; }
        .retention-table td { padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); color: #555; }
        .retention-bar { background: linear-gradient(90deg, #667eea, #764ba2); height: 24px; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; border-radius: 6px; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">📊 Dashboard</div>
                <div class="sidebar-subtitle">9 Projects</div>
            </div>
            <div class="sidebar-content" id="projectList"></div>
        </div>

        <div class="main">
            <div class="header">
                <div class="header-left">
                    <h1 id="headerTitle">Analytics Dashboard</h1>
                    <p id="headerSubtitle">Real-time insights from all projects</p>
                </div>
                <div class="header-right">
                    <div class="date-controls">
                        <button class="date-button active" onclick="setDateRange(7)">7 days</button>
                        <button class="date-button" onclick="setDateRange(30)">30 days</button>
                        <button class="date-button" onclick="setDateRange(90)">90 days</button>
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span class="live-text">Live</span>
                    </div>
                </div>
            </div>

            <div class="content" id="contentArea">
                <div style="text-align: center; color: rgba(255,255,255,0.8); padding: 40px; font-size: 16px;">⏳ Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const projects = ['Football Mania Web', 'Football Mania App', '2CanPlay Web', '2CanPlay Mobile App', 'Spin-N-Win', 'Wheel of Fortune', 'Edumillionaire', 'Fifty-Fifty', 'Football Frenzy'];
        let currentView = 'overview';
        let selectedProject = null;
        let dashboardData = {};

        function init() {
            renderSidebar();
            refreshData();
            setInterval(refreshData, 30000);
        }

        function renderSidebar() {
            const list = document.getElementById('projectList');
            list.innerHTML = projects.map((p, i) => `<div class="project-item ${i === 0 ? 'active' : ''}" onclick="selectProject(${i})">${p}</div>`).join('');
        }

        function selectProject(index) {
            selectedProject = index;
            currentView = 'detail';
            renderContent();
            updateSidebar();
        }

        function backToOverview() {
            currentView = 'overview';
            selectedProject = null;
            renderContent();
            updateSidebar();
        }

        function updateSidebar() {
            const items = document.querySelectorAll('.project-item');
            items.forEach((item, i) => {
                item.classList.remove('active');
                if (currentView === 'detail' && i === selectedProject) {
                    item.classList.add('active');
                } else if (currentView === 'overview' && i === 0) {
                    item.classList.add('active');
                }
            });
        }

        function setDateRange(days) {
            document.querySelectorAll('.date-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            refreshData();
        }

        function refreshData() {
            dashboardData = {};
            projects.forEach((name, index) => {
                const baseDAU = 3000 + (index * 400);
                const baseMAU = 8000 + (index * 800);
                const baseWAU = Math.round(baseDAU * 1.8);
                const baseSignups = 50 + (index * 15);
                const stickiness = Math.round((baseDAU / baseMAU) * 100);
                
                dashboardData[index] = {
                    name: name,
                    dau: baseDAU + Math.floor(Math.random() * 500),
                    mau: baseMAU + Math.floor(Math.random() * 1000),
                    wau: baseWAU + Math.floor(Math.random() * 300),
                    signups: baseSignups + Math.floor(Math.random() * 20),
                    stickiness: stickiness + Math.floor(Math.random() * 5),
                    churnRate: 8 + index + Math.floor(Math.random() * 3),
                    retention: { d0: 100, d1: 92 - (index % 3), d7: 68 - (index % 4), d30: 34 - (index % 5) }
                };
            });
            renderContent();
        }

        function renderContent() {
            if (currentView === 'overview') renderOverview();
            else if (currentView === 'detail') renderDetail();
        }

        function renderOverview() {
            document.getElementById('headerTitle').textContent = '📊 Analytics Dashboard';
            document.getElementById('headerSubtitle').textContent = 'Real-time insights from all projects';
            const allData = Object.values(dashboardData);
            const totalDAU = allData.reduce((sum, p) => sum + p.dau, 0);
            const totalSignups = allData.reduce((sum, p) => sum + p.signups, 0);
            const avgStickiness = Math.round(allData.reduce((sum, p) => sum + p.stickiness, 0) / allData.length);
            const avgChurn = Math.round(allData.reduce((sum, p) => sum + p.churnRate, 0) / allData.length);

            let html = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">👥 Total Active Users</div>
                        <div class="metric-value">${totalDAU.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 8.2% vs yesterday</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">✨ Total New Signups</div>
                        <div class="metric-value">${totalSignups.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 12.5% vs last period</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">📈 Avg Stickiness</div>
                        <div class="metric-value">${avgStickiness}%</div>
                        <div class="metric-change negative">↓ 2.1% vs last period</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">📊 Avg Churn Rate</div>
                        <div class="metric-value">${avgChurn}%</div>
                        <div class="metric-change">Steady</div>
                    </div>
                </div>
                <div class="section-title">🎮 Project Summary</div>
                <p class="section-subtitle">Click any project to view detailed performance metrics, retention cohorts, and trends.</p>
                <div class="projects-grid">
            `;
            projects.forEach((p, i) => {
                const data = dashboardData[i];
                html += `
                    <div class="project-card" onclick="selectProject(${i})">
                        <div class="project-card-title">${p}</div>
                        <div class="project-card-metrics">
                            <div class="project-card-metric">
                                <div class="project-card-label">DAU</div>
                                <div class="project-card-value">${data.dau.toLocaleString()}</div>
                            </div>
                            <div class="project-card-metric">
                                <div class="project-card-label">Signups</div>
                                <div class="project-card-value">${data.signups}</div>
                            </div>
                        </div>
                        <div class="project-card-footer">Stickiness: ${data.stickiness}% • Churn: ${data.churnRate}%</div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderDetail() {
            const p = projects[selectedProject];
            const data = dashboardData[selectedProject];
            document.getElementById('headerTitle').textContent = `📊 ${p}`;
            document.getElementById('headerSubtitle').textContent = 'Detailed performance metrics';

            const html = `
                <button class="back-button" onclick="backToOverview()">← Back to Overview</button>
                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-label">Daily Active</div><div class="metric-value">${data.dau.toLocaleString()}</div><div class="metric-change positive">↑ 5.2%</div></div>
                    <div class="metric-card"><div class="metric-label">Monthly Active</div><div class="metric-value">${data.mau.toLocaleString()}</div><div class="metric-change positive">↑ 3.1%</div></div>
                    <div class="metric-card"><div class="metric-label">Weekly Active</div><div class="metric-value">${data.wau.toLocaleString()}</div><div class="metric-change positive">↑ 2.8%</div></div>
                    <div class="metric-card"><div class="metric-label">Stickiness</div><div class="metric-value">${data.stickiness}%</div><div class="metric-change negative">↓ 1.5%</div></div>
                    <div class="metric-card"><div class="metric-label">Churn Rate</div><div class="metric-value">${data.churnRate}%</div><div class="metric-change">Steady</div></div>
                </div>
                <div class="retention-section">
                    <div class="retention-title">📊 Retention Cohort Analysis</div>
                    <table class="retention-table">
                        <thead>
                            <tr>
                                <th>📅 Day</th>
                                <th>👥 Users</th>
                                <th>📈 Retention</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td><strong>D0</strong></td><td>${data.dau.toLocaleString()}</td><td><div class="retention-bar" style="width: 100%;">100%</div></td></tr>
                            <tr><td><strong>D1</strong></td><td>${Math.round(data.dau * 0.92).toLocaleString()}</td><td><div class="retention-bar" style="width: ${data.retention.d1}%;">${data.retention.d1}%</div></td></tr>
                            <tr><td><strong>D7</strong></td><td>${Math.round(data.dau * 0.68).toLocaleString()}</td><td><div class="retention-bar" style="width: ${data.retention.d7}%;">${data.retention.d7}%</div></td></tr>
                            <tr><td><strong>D30</strong></td><td>${Math.round(data.dau * 0.34).toLocaleString()}</td><td><div class="retention-bar" style="width: ${data.retention.d30}%;">${data.retention.d30}%</div></td></tr>
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        init();
    </script>
</body>
</html>
