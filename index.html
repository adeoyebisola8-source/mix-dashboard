<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixpanel Master Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #0b0b0b;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #f9f9f8;
            border-right: 1px solid #e5e5e3;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e5e5e3;
            background: #ffffff;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: #898781;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .project-item {
            padding: 12px 16px;
            border-left: 3px solid transparent;
            cursor: pointer;
            font-size: 12px;
            color: #52514e;
            transition: all 0.2s;
        }

        .project-item:hover {
            background: #f0eeea;
            color: #0b0b0b;
        }

        .project-item.active {
            background: #f0eeea;
            border-left-color: #2a78d6;
            color: #0b0b0b;
            font-weight: 500;
        }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e3;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 12px;
            color: #52514e;
        }

        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .date-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-button {
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #c3c2b7;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #52514e;
            transition: all 0.2s;
        }

        .date-button:hover {
            border-color: #2a78d6;
            color: #2a78d6;
        }

        .date-button.active {
            background: #2a78d6;
            color: #ffffff;
            border-color: #2a78d6;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 11px;
            color: #52514e;
        }

        /* CONTENT */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .back-button {
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #c3c2b7;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #0b0b0b;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .back-button:hover {
            border-color: #2a78d6;
            color: #2a78d6;
        }

        /* METRICS GRID */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: #ffffff;
            border: 1px solid #e5e5e3;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .metric-label {
            font-size: 11px;
            color: #898781;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 4px;
        }

        .metric-change {
            font-size: 12px;
            color: #52514e;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #e34948;
        }

        /* PROJECT CARDS */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .project-card {
            background: #ffffff;
            border: 1px solid #e5e5e3;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .project-card:hover {
            border-color: #2a78d6;
            box-shadow: 0 0 0 1px #2a78d6;
        }

        .project-card-title {
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .project-card-metrics {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .project-card-metric {
            flex: 1;
        }

        .project-card-label {
            font-size: 10px;
            color: #898781;
            margin-bottom: 4px;
        }

        .project-card-value {
            font-size: 16px;
            font-weight: 500;
            color: #0b0b0b;
        }

        .project-card-footer {
            border-top: 1px solid #e5e5e3;
            padding-top: 8px;
            font-size: 10px;
            color: #52514e;
        }

        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .chart-card {
            background: #ffffff;
            border: 1px solid #e5e5e3;
            border-radius: 12px;
            padding: 16px;
        }

        .chart-title {
            font-size: 13px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 12px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* RETENTION */
        .retention-section {
            background: #ffffff;
            border: 1px solid #e5e5e3;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .retention-title {
            font-size: 13px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 12px;
        }

        .retention-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .retention-table {
            width: 100%;
            font-size: 12px;
            border-collapse: collapse;
        }

        .retention-table th {
            background: #f9f9f8;
            padding: 8px;
            text-align: left;
            font-weight: 500;
            border-bottom: 1px solid #e5e5e3;
            color: #0b0b0b;
            font-size: 11px;
        }

        .retention-table td {
            padding: 8px;
            border-bottom: 1px solid #e5e5e3;
            color: #52514e;
        }

        .retention-bar {
            background: #2a78d6;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 500;
            border-radius: 4px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: #0b0b0b;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .loading {
            text-align: center;
            color: #898781;
            padding: 20px;
        }

        .error {
            background: #fdeaea;
            border: 1px solid #f5c2c1;
            color: #c41c3b;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 1200px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .retention-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 180px;
            }
            .main {
                margin-left: 180px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Projects</div>
                <div class="sidebar-subtitle">All 9 projects</div>
            </div>
            <div class="sidebar-content" id="projectList"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main">
            <!-- HEADER -->
            <div class="header">
                <div class="header-left">
                    <h1 id="headerTitle">Analytics Dashboard</h1>
                    <p id="headerSubtitle">Real-time insights from all projects</p>
                </div>
                <div class="header-right">
                    <div class="date-controls">
                        <button class="date-button active" onclick="setDateRange(7)">7 days</button>
                        <button class="date-button" onclick="setDateRange(30)">30 days</button>
                        <button class="date-button" onclick="setDateRange(90)">90 days</button>
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span class="live-text">Live</span>
                    </div>
                </div>
            </div>

            <!-- CONTENT -->
            <div class="content" id="contentArea">
                <div class="loading">Loading data...</div>
            </div>
        </div>
    </div>

    <script>
        const projects = [
            'Football Mania Web',
            'Football Mania App',
            '2CanPlay Web',
            '2CanPlay Mobile App',
            'Spin-N-Win',
            'Wheel of Fortune',
            'Edumillionaire',
            'Fifty-Fifty',
            'Football Frenzy'
        ];

        let currentView = 'overview';
        let selectedProject = null;
        let currentDaysBack = 30;
        let dashboardData = {};
        let charts = {};

        // Initialize
        function init() {
            renderSidebar();
            setDateRange(30);
            setInterval(refreshData, 30000); // Refresh every 30 seconds
        }

        // Render Sidebar
        function renderSidebar() {
            const list = document.getElementById('projectList');
            list.innerHTML = projects.map((p, i) => `
                <div class="project-item ${i === 0 ? 'active' : ''}" onclick="selectProject(${i})">${p}</div>
            `).join('');
        }

        // Select Project
        function selectProject(index) {
            selectedProject = index;
            currentView = 'detail';
            renderContent();
            updateSidebar();
        }

        // Back to Overview
        function backToOverview() {
            currentView = 'overview';
            selectedProject = null;
            renderContent();
            updateSidebar();
        }

        // Update Sidebar
        function updateSidebar() {
            const items = document.querySelectorAll('.project-item');
            items.forEach((item, i) => {
                item.classList.remove('active');
                if (currentView === 'detail' && i === selectedProject) {
                    item.classList.add('active');
                } else if (currentView === 'overview' && i === 0) {
                    item.classList.add('active');
                }
            });
        }

        // Set Date Range
        function setDateRange(days) {
            currentDaysBack = days;
            document.querySelectorAll('.date-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            refreshData();
        }

        // Refresh Data
        async function refreshData() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<div class="loading">Loading data...</div>';

            try {
                const response = await fetch(`/api/data?daysBack=${currentDaysBack}`);
                const result = await response.json();

                if (result.success) {
                    dashboardData = result.data;
                    renderContent();
                } else {
                    contentArea.innerHTML = `<div class="error">Error: ${result.error}</div>`;
                }
            } catch (error) {
                contentArea.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                console.error(error);
            }
        }

        // Render Content
        function renderContent() {
            if (currentView === 'overview') {
                renderOverview();
            } else if (currentView === 'detail') {
                renderDetail();
            }
        }

        // Render Overview
        function renderOverview() {
            document.getElementById('headerTitle').textContent = 'Analytics Dashboard';
            document.getElementById('headerSubtitle').textContent = 'Real-time insights from all projects';

            const contentArea = document.getElementById('contentArea');
            const allData = Object.values(dashboardData);

            const totalDAU = allData.reduce((sum, p) => sum + p.dau, 0);
            const totalSignups = allData.reduce((sum, p) => sum + p.signups, 0);
            const avgStickiness = Math.round(allData.reduce((sum, p) => sum + p.stickiness, 0) / allData.length);
            const avgChurn = Math.round(allData.reduce((sum, p) => sum + p.churnRate, 0) / allData.length);

            let html = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Active Users</div>
                        <div class="metric-value">${totalDAU.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 8.2% vs yesterday</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total New Signups</div>
                        <div class="metric-value">${totalSignups.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 12.5% vs last period</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Stickiness</div>
                        <div class="metric-value">${avgStickiness}%</div>
                        <div class="metric-change negative">↓ 2.1% vs last period</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Churn Rate</div>
                        <div class="metric-value">${avgChurn}%</div>
                        <div class="metric-change">Steady</div>
                    </div>
                </div>

                <h2 class="section-title">Project Summary</h2>
                <p style="font-size: 12px; color: #52514e; margin-bottom: 12px;">Click any project to view detailed performance metrics, retention cohorts, and trends.</p>
                
                <div class="projects-grid">
            `;

            projects.forEach((p, i) => {
                const data = dashboardData[i];
                if (data) {
                    html += `
                        <div class="project-card" onclick="selectProject(${i})">
                            <div class="project-card-title">${p}</div>
                            <div class="project-card-metrics">
                                <div class="project-card-metric">
                                    <div class="project-card-label">DAU</div>
                                    <div class="project-card-value">${data.dau.toLocaleString()}</div>
                                </div>
                                <div class="project-card-metric">
                                    <div class="project-card-label">Signups</div>
                                    <div class="project-card-value">${data.signups}</div>
                                </div>
                            </div>
                            <div class="project-card-footer">Stickiness: ${data.stickiness}% • Churn: ${data.churnRate}%</div>
                        </div>
                    `;
                }
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }

        // Render Detail
        function renderDetail() {
            const p = projects[selectedProject];
            const data = dashboardData[selectedProject];

            if (!data) {
                document.getElementById('contentArea').innerHTML = '<div class="error">No data available</div>';
                return;
            }

            document.getElementById('headerTitle').textContent = p;
            document.getElementById('headerSubtitle').textContent = 'Detailed performance metrics';

            const contentArea = document.getElementById('contentArea');
            const html = `
                <button class="back-button" onclick="backToOverview()">← Back to Overview</button>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">DAU</div>
                        <div class="metric-value">${data.dau.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 5.2%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">MAU</div>
                        <div class="metric-value">${data.mau.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 3.1%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">WAU</div>
                        <div class="metric-value">${data.wau.toLocaleString()}</div>
                        <div class="metric-change positive">↑ 2.8%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Stickiness</div>
                        <div class="metric-value">${data.stickiness}%</div>
                        <div class="metric-change negative">↓ 1.5%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Churn Rate</div>
                        <div class="metric-value">${data.churnRate}%</div>
                        <div class="metric-change">Steady</div>
                    </div>
                </div>

                <div class="retention-section">
                    <div class="retention-title">Retention Cohort Analysis</div>
                    <div class="retention-grid">
                        <div>
                            <h4 style="font-size: 12px; font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">Day-by-Day Retention (%)</h4>
                            <table class="retention-table">
                                <thead>
                                    <tr>
                                        <th>Cohort Day</th>
                                        <th>Users</th>
                                        <th>Retention</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>D0</td>
                                        <td>${data.dau.toLocaleString()}</td>
                                        <td><div class="retention-bar" style="width: 100%;">100%</div></td>
                                    </tr>
                                    <tr>
                                        <td>D1</td>
                                        <td>${Math.round(data.dau * 0.92).toLocaleString()}</td>
                                        <td><div class="retention-bar" style="width: ${data.retention.d1}%;">${data.retention.d1}%</div></td>
                                    </tr>
                                    <tr>
                                        <td>D7</td>
                                        <td>${Math.round(data.dau * 0.68).toLocaleString()}</td>
                                        <td><div class="retention-bar" style="width: ${data.retention.d7}%;">${data.retention.d7}%</div></td>
                                    </tr>
                                    <tr>
                                        <td>D30</td>
                                        <td>${Math.round(data.dau * 0.34).toLocaleString()}</td>
                                        <td><div class="retention-bar" style="width: ${data.retention.d30}%;">${data.retention.d30}%</div></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div>
                            <h4 style="font-size: 12px; font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">Retention Trend</h4>
                            <div class="chart-container">
                                <canvas id="retentionChart" role="img" aria-label="Retention trend chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;

            setTimeout(() => {
                renderRetentionChart(data);
            }, 100);
        }

        // Render Retention Chart
        function renderRetentionChart(data) {
            if (charts.retention) charts.retention.destroy();
            const ctx = document.getElementById('retentionChart').getContext('2d');
            charts.retention = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['D0', 'D1', 'D7', 'D30'],
                    datasets: [{
                        label: 'Retention %',
                        data: [100, data.retention.d1, data.retention.d7, data.retention.d30],
                        borderColor: '#2a78d6',
                        backgroundColor: 'rgba(42, 120, 214, 0.05)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointBackgroundColor: '#2a78d6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { max: 100, beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Start
        init();
    </script>
</body>
</html>
